openapi: 3.1.0
info:
  title: LORE Headless LMS API
  version: 1.0.0
  summary: Learning Orchestration Runtime Engine
  description: >
    Headless LMS API. The pedagogical runtime owns planning, mastery, review
    scheduling, assessments, traces, snapshots and event emission. LLM providers
    only generate content from runtime-created TutorInstruction records.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /v1/auth/token:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, user_id]
              properties:
                tenant_id: { type: string, format: uuid }
                user_id: { type: string }
                ttl_seconds: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/tenants:
    get:
      responses:
        "200":
          description: Tenants visible to a super-admin
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                parent_id: { type: string, format: uuid }
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }

  /v1/tenants/{tenant_id}:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/users:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /v1/tenants/{tenant_id}/memberships:
    post:
      security: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }

  /v1/tenants/{tenant_id}/users:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant users with membership context
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantUser" }

  /v1/tenants/{tenant_id}/users/{user_id}:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUserPatch" }
      responses:
        "200":
          description: Tenant user updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUser" }
    delete:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Tenant user archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUser" }

  /v1/tenants/{tenant_id}/learners:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant learners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Learner" }

  /v1/tenants/{tenant_id}/programs:
    get:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      responses:
        "200":
          description: Tenant programs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Program" }
    post:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Program created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }

  /v1/tenants/{tenant_id}/programs/{program_id}:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ProgramID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramPatch" }
      responses:
        "200":
          description: Program updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
    delete:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ProgramID"
      responses:
        "200":
          description: Program archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }

  /v1/tenants/{tenant_id}/cohorts:
    get:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      responses:
        "200":
          description: Tenant cohorts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cohort" }
    post:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                program_id: { type: string }
                name: { type: string }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
      responses:
        "201":
          description: Cohort created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cohort" }

  /v1/tenants/{tenant_id}/cohorts/{cohort_id}:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CohortPatch" }
      responses:
        "200":
          description: Cohort updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cohort" }
    delete:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      responses:
        "200":
          description: Cohort archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cohort" }

  /v1/tenants/{tenant_id}/cohorts/{cohort_id}/enrollments:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      responses:
        "200":
          description: Cohort enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CohortEnrollment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learner_id]
              properties:
                learner_id: { type: string }
      responses:
        "201":
          description: Learner enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortEnrollment" }

  /v1/tenants/{tenant_id}/cohorts/{cohort_id}/enrollments/{learner_id}:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
        - $ref: "#/components/parameters/LearnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        "200":
          description: Enrollment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortEnrollment" }
    delete:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
        - $ref: "#/components/parameters/LearnerID"
      responses:
        "200":
          description: Enrollment archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortEnrollment" }

  /v1/tenants/{tenant_id}/training-sessions:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: cohort_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Planned training sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainingSession" }
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingSessionRequest" }
      responses:
        "201":
          description: Training session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSession" }

  /v1/tenants/{tenant_id}/training-sessions/{session_id}:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingSessionPatch" }
      responses:
        "200":
          description: Training session updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSession" }
    delete:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Training session archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSession" }

  /v1/tenants/{tenant_id}/admin-audit-logs:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: target_type
          in: query
          required: false
          schema: { type: string }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Tenant admin audit log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAuditLog" }

  /v1/tenants/{tenant_id}/syllabi:
    get:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      responses:
        "200":
          description: Tenant syllabi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Syllabus" }
    post:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                objectives: { type: object, additionalProperties: true }
                outcomes: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Syllabus created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Syllabus" }

  /v1/tenants/{tenant_id}/syllabi/{syllabus_id}/bindings:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: syllabus_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type: { type: string, enum: [PROGRAM, COHORT, LEARNER] }
                target_id: { type: string }
                adaptation_mode: { type: string, enum: [STRICT, GUIDED, FREE] }
      responses:
        "201":
          description: Syllabus binding created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyllabusBinding" }

  /v1/tenants/{tenant_id}/domains:
    get:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      responses:
        "200":
          description: Tenant domains
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Domain" }
    post:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainGraphRequest" }
      responses:
        "201":
          description: Domain graph created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainGraph" }

  /v1/tenants/{tenant_id}/domains/{domain_id}:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Domain graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainGraph" }

  /v1/tenants/{tenant_id}/domains/{domain_id}/graph:
    put:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/DomainID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concepts]
              properties:
                concepts:
                  type: array
                  items: { $ref: "#/components/schemas/ConceptDraft" }
                dependencies:
                  type: array
                  items: { $ref: "#/components/schemas/DependencyDraft" }
      responses:
        "200":
          description: Domain graph replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainGraph" }

  /v1/tenants/{tenant_id}/learners/{learner_id}/activities/next:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LearnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id]
              properties:
                domain_id: { type: string }
                intent: { type: string, enum: [auto, review, assessment] }
      responses:
        "201":
          description: Runtime planned next activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeDecision" }

  /v1/tenants/{tenant_id}/activities/{activity_id}/start:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: Activity started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }

  /v1/tenants/{tenant_id}/cohorts/{cohort_id}/invites:
    get:
      description: List self-enrollment invites of a cohort (admin) — B-23.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      responses:
        "200":
          description: Invites, newest first
    post:
      description: Create a self-enrollment invite code (admin) — B-23.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours: { type: integer, minimum: 0 }
                max_uses: { type: integer, minimum: 0, description: "0 = unlimited" }
      responses:
        "201":
          description: Invite created (code returned once; treat as a secret)

  /v1/tenants/{tenant_id}/invites/{invite_id}:
    delete:
      description: Revoke an invite (admin) — B-23.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: invite_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Invite revoked }

  /v1/invites/{code}:
    get:
      description: PUBLIC invite lookup (the unguessable code is the credential) — returns display names + usability, never counters.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Invite display data }

  /v1/invites/{code}/redeem:
    post:
      description: Redeem an invite for a provisioned user (TRUSTED WEB TIER ONLY — bootstrap secret required). Grants LEARNER membership + enrollment, burns one use.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        "201": { description: Membership granted and learner enrolled }

  /v1/tenants/{tenant_id}/syllabi/{syllabus_id}/modules:
    get:
      description: Ordered editorial modules of a syllabus (B-24).
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: syllabus_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Modules ordered by position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourseModule" }
    post:
      description: Create a module (trainer/admin). Prerequisites must point at earlier modules of the same syllabus.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: syllabus_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, position]
              properties:
                title: { type: string }
                description: { type: string }
                position: { type: integer, minimum: 0 }
                concept_ids: { type: array, items: { type: string } }
                prerequisite_ids: { type: array, items: { type: string } }
                required_mastery: { type: number, exclusiveMinimum: 0, maximum: 1 }
      responses:
        "201":
          description: Module created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseModule" }

  /v1/tenants/{tenant_id}/modules/{module_id}:
    patch:
      description: Update an editorial module (B-24).
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: module_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Module updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseModule" }
    delete:
      description: Archive an editorial module (B-24).
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: module_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Module archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseModule" }

  /v1/tenants/{tenant_id}/learners/{learner_id}/path:
    get:
      description: Evidence-based module path for a learner (B-24) — LOCKED/AVAILABLE/IN_PROGRESS/COMPLETED per module.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LearnerID"
        - name: syllabus_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Module progress rows, ordered by position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleProgress" }

  /v1/tenants/{tenant_id}/activities/{activity_id}/pause:
    post:
      description: Pause the training-time clock on a started activity (B-07). Idempotent while paused.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: Activity paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }

  /v1/tenants/{tenant_id}/activities/{activity_id}/resume:
    post:
      description: Close the open pause on a started activity (B-07).
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: Activity resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }

  /v1/tenants/{tenant_id}/interactions:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionCommand" }
      responses:
        "201":
          description: Interaction recorded and learner model updated
          headers:
            X-LORE-Idempotent-Replay:
              description: Present with value true when the response is replayed for a previously seen Idempotency-Key.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateDelta" }

  /v1/tenants/{tenant_id}/learners/{learner_id}/assessments/plan:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LearnerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id]
              properties:
                domain_id: { type: string }
      responses:
        "201":
          description: Runtime planned an assessment activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeDecision" }

  /v1/tenants/{tenant_id}/assessments/{activity_id}/submit:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionCommand" }
      responses:
        "201":
          description: Assessment evidence recorded by runtime
          headers:
            X-LORE-Idempotent-Replay:
              description: Present with value true when the response is replayed for a previously seen Idempotency-Key.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateDelta" }

  /v1/tenants/{tenant_id}/learners/{learner_id}/state:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LearnerID"
      responses:
        "200":
          description: Learner model
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearnerState" }

  /v1/tenants/{tenant_id}/learners/{learner_id}/reviews/due:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LearnerID"
      responses:
        "200":
          description: Review cards due for learner
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewCard" }

  /v1/tenants/{tenant_id}/learners/{learner_id}/snapshots:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LearnerID"
      responses:
        "200":
          description: Pedagogical snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PedagogicalSnapshot" }

  /v1/tenants/{tenant_id}/llm-configurations:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LLMScopeType"
        - $ref: "#/components/parameters/LLMScopeID"
      responses:
        "200":
          description: Active LLM configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMConfiguration" }
    put:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/LLMScopeType"
        - $ref: "#/components/parameters/LLMScopeID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LLMConfiguration" }
      responses:
        "200":
          description: Updated LLM configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMConfiguration" }

  /v1/tenants/{tenant_id}/tutor-instructions/{instruction_id}/generate:
    post:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: instruction_id
          in: path
          required: true
          schema: { type: string }
        - name: learner_id
          in: query
          required: false
          schema: { type: string }
          description: Optional learner scope override for LLM configuration resolution.
        - name: cohort_id
          in: query
          required: false
          schema: { type: string }
          description: Optional cohort scope override for LLM configuration resolution.
        - name: program_id
          in: query
          required: false
          schema: { type: string }
          description: Optional program scope override for LLM configuration resolution.
      responses:
        "201":
          description: Generated content linked to instruction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratedContent" }

  /v1/tenants/{tenant_id}/generated-content:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: instruction_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Generated content records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GeneratedContent" }

  /v1/tenants/{tenant_id}/generated-content/{content_id}:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: content_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Generated content record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratedContent" }

  /v1/tenants/{tenant_id}/events/outbox:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: published
          in: query
          required: false
          schema: { type: string, enum: ["false"] }
        - name: unpublished
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Tenant outbox events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }

  /v1/tenants/{tenant_id}/events/{event_id}/published:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event marked published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /v1/tenants/{tenant_id}/analytics/cohorts/{cohort_id}:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      responses:
        "200":
          description: Cohort analytics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/tenants/{tenant_id}/analytics/cohorts/{cohort_id}/training-time.csv:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      responses:
        "200":
          description: Cohort training time CSV export
          content:
            text/csv:
              schema:
                type: string

  /v1/tenants/{tenant_id}/analytics/cohorts/{cohort_id}/progress.csv:
    get:
      description: Per-learner progress/completion export (concepts tracked/mastered, averages, hours) — B-12/B-22.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/CohortID"
      responses:
        "200":
          description: Cohort progress CSV export
          content:
            text/csv:
              schema:
                type: string

  /v1/tenants/{tenant_id}/alerts:
    get:
      parameters: [{ $ref: "#/components/parameters/TenantID" }]
      responses:
        "200":
          description: Runtime alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }

  /v1/tenants/{tenant_id}/alerts/{alert_id}:
    patch:
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: alert_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }

  # --- B-26 Banque de questions, devoirs, correction manuelle ---
  /v1/tenants/{tenant_id}/questions:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Créer une question de banque (QCM single_choice ou short_answer)
      responses: { "201": { description: Question créée } }
    get:
      summary: Lister la banque (filtre ?concept_id=) — la clé de correction n'est jamais servie aux apprenants (route staff)
      responses: { "200": { description: Questions } }
  /v1/tenants/{tenant_id}/questions/{question_id}:
    delete:
      summary: Archiver une question
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: question_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Question archivée } }
  /v1/tenants/{tenant_id}/cohorts/{cohort_id}/assignments:
    post:
      summary: Créer un devoir (échéance, liaison domaine/concept optionnelle vers le BKT)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: cohort_id, in: path, required: true, schema: { type: string } }
      responses: { "201": { description: Devoir créé } }
  /v1/tenants/{tenant_id}/assignments:
    get:
      summary: Lister les devoirs (un jeton apprenant est réduit à ses cohortes)
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Devoirs } }
  /v1/tenants/{tenant_id}/assignments/{assignment_id}/submissions:
    parameters:
      - { name: tenant_id, in: path, required: true, schema: { type: string } }
      - { name: assignment_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Rendre sa copie (apprenant ; re-soumission libre tant que non notée, 409 ensuite)
      responses: { "201": { description: Copie rendue }, "409": { description: Déjà notée } }
    get:
      summary: Lister les copies (staff = toutes ; un jeton apprenant ne voit que la sienne)
      responses: { "200": { description: Copies } }
  /v1/tenants/{tenant_id}/submissions/{submission_id}/grade:
    post:
      summary: Corriger (score 0..1 + feedback) — alimente le runtime si le devoir est lié à un concept
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: submission_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Copie notée } }

  # --- B-10 Documents contractuels OF (versionnés) ---
  /v1/tenants/{tenant_id}/documents:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Créer un document (CONVENTION, CONTRAT, DEVIS, PROGRAMME, REGLEMENT) — capacité manage_documents
      responses: { "201": { description: Document créé } }
    get:
      summary: Lister (dernière version par chaîne ; un apprenant ne voit que son périmètre)
      responses: { "200": { description: Documents } }
  /v1/tenants/{tenant_id}/documents/{document_id}:
    parameters:
      - { name: tenant_id, in: path, required: true, schema: { type: string } }
      - { name: document_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Lire un document (scope apprenant vérifié)
      responses: { "200": { description: Document } }
    delete:
      summary: Archiver la chaîne
      responses: { "200": { description: Document archivé } }
  /v1/tenants/{tenant_id}/documents/{document_id}/versions:
    post:
      summary: Publier une nouvelle version (append-only via root_id)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: document_id, in: path, required: true, schema: { type: string } }
      responses: { "201": { description: Nouvelle version } }

  # --- B-08 Profil OF + export Qualiopi ---
  /v1/tenants/{tenant_id}/profile:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Profil légal de l'OF (raison sociale, SIRET, NDA, signataire...)
      responses: { "200": { description: Profil } }
    put:
      summary: Mettre à jour le profil (capacité manage_documents)
      responses: { "200": { description: Profil enregistré } }
  /v1/tenants/{tenant_id}/cohorts/{cohort_id}/qualiopi-export:
    get:
      summary: Bundle JSON de preuves Qualiopi (profil, progression, temps, enquêtes, réclamations, audit)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: cohort_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Export de preuves } }

  # --- B-11 Satisfaction + réclamations ---
  /v1/tenants/{tenant_id}/cohorts/{cohort_id}/surveys:
    post:
      summary: Créer une enquête HOT (à chaud) ou COLD (à froid) avec questions scale|text
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: cohort_id, in: path, required: true, schema: { type: string } }
      responses: { "201": { description: Enquête créée } }
  /v1/tenants/{tenant_id}/surveys:
    get:
      summary: Lister les enquêtes (apprenant = ses cohortes)
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Enquêtes } }
  /v1/tenants/{tenant_id}/surveys/{survey_id}/responses:
    parameters:
      - { name: tenant_id, in: path, required: true, schema: { type: string } }
      - { name: survey_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Répondre (apprenant inscrit, une réponse par enquête, scale 1..5)
      responses: { "201": { description: Réponse enregistrée } }
    get:
      summary: Lire les réponses (staff)
      responses: { "200": { description: Réponses } }
  /v1/tenants/{tenant_id}/complaints:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Déposer une réclamation (identité forcée depuis le jeton apprenant)
      responses: { "201": { description: Réclamation ouverte } }
    get:
      summary: Registre des réclamations (staff)
      responses: { "200": { description: Réclamations } }
  /v1/tenants/{tenant_id}/complaints/{complaint_id}:
    patch:
      summary: Traiter (statut OPEN→IN_PROGRESS→RESOLVED→CLOSED, résolution) — capacité manage_quality
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Réclamation mise à jour } }

  # --- B-16 Curation + B-18 Annonces ---
  /v1/tenants/{tenant_id}/content-review:
    get:
      summary: File de revue du contenu généré (?status=PENDING_REVIEW|APPROVED|REJECTED)
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Contenus à revoir } }
  /v1/tenants/{tenant_id}/content-review/{content_id}:
    post:
      summary: Approuver ou rejeter (REJECTED disparaît des lectures persistées)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: content_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Contenu revu } }
  /v1/tenants/{tenant_id}/announcements:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Publier une annonce (cohorte ou tenant entier)
      responses: { "201": { description: Annonce publiée } }
    get:
      summary: Lister (apprenant = ses cohortes + tenant-wide)
      responses: { "200": { description: Annonces } }
  /v1/tenants/{tenant_id}/announcements/{announcement_id}:
    delete:
      summary: Archiver une annonce
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: announcement_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Annonce archivée } }

  # --- B-15 Financements + BPF ---
  /v1/tenants/{tenant_id}/funding-files:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Ouvrir un dossier de financement (CPF, OPCO, FRANCE_TRAVAIL, EMPLOYEUR, AUTOFINANCEMENT, AUTRE) — capacité manage_finance
      responses: { "201": { description: Dossier créé } }
    get:
      summary: Lister (?learner_id=)
      responses: { "200": { description: Dossiers } }
  /v1/tenants/{tenant_id}/funding-files/{file_id}:
    parameters:
      - { name: tenant_id, in: path, required: true, schema: { type: string } }
      - { name: file_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Mettre à jour (statut EN_INSTRUCTION→ACCEPTE/REFUSE/SOLDE, montant, référence)
      responses: { "200": { description: Dossier mis à jour } }
    delete:
      summary: Archiver
      responses: { "200": { description: Dossier archivé } }
  /v1/tenants/{tenant_id}/bpf-export:
    get:
      summary: Agrégat BPF annuel (?year=) — produits par origine de financement, stagiaires, heures réellement tracées
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses: { "200": { description: Rapport BPF } }

  # --- B-28 Textes légaux + consentements / B-14 effacement ---
  /v1/tenants/{tenant_id}/legal-texts:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Publier une version (CGU, CONFIDENTIALITE, MENTIONS ; version = max+1) — capacité manage_legal
      responses: { "201": { description: Texte publié } }
    get:
      summary: Dernière version par kind (?history=1 pour l'historique, staff)
      responses: { "200": { description: Textes } }
  /v1/tenants/{tenant_id}/consents:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Consentir à un texte (identité du jeton ; idempotent par texte)
      responses: { "201": { description: Consentement enregistré } }
    get:
      summary: Registre (staff ; un apprenant ne voit que les siens)
      responses: { "200": { description: Consentements } }
  /v1/tenants/{tenant_id}/learners/{learner_id}/data:
    delete:
      summary: Effacement RGPD des données d'un apprenant (capacité erase_data, admin uniquement)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: learner_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Données effacées (résumé) } }

  # --- B-17 Ressources pédagogiques ---
  /v1/tenants/{tenant_id}/resources:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Partager une ressource (FICHIER base64 ≤ 20 MiB ou LIEN http/https ; cohorte ou tenant)
      responses: { "201": { description: Ressource créée } }
    get:
      summary: Lister (apprenant = ses cohortes + tenant-wide ; jamais les octets)
      responses: { "200": { description: Ressources } }
  /v1/tenants/{tenant_id}/resources/{resource_id}/download:
    get:
      summary: Télécharger (FICHIER = octets + Content-Disposition ; LIEN = 302)
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: resource_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Contenu }, "302": { description: Redirection } }
  /v1/tenants/{tenant_id}/resources/{resource_id}:
    delete:
      summary: Archiver une ressource
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: resource_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Ressource archivée } }

  # --- B-20 Webhooks signés ---
  /v1/tenants/{tenant_id}/webhooks:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: S'abonner aux événements (secret HMAC généré serveur, montré une seule fois) — capacité configure_technical
      responses: { "201": { description: Abonnement créé (avec secret) } }
    get:
      summary: Lister les abonnements (sans secret)
      responses: { "200": { description: Abonnements } }
  /v1/tenants/{tenant_id}/webhooks/{subscription_id}:
    delete:
      summary: Résilier un abonnement
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: subscription_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Abonnement archivé } }

  # --- B-25 Sessions / agenda ---
  /v1/tenants/{tenant_id}/training-sessions:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Planifier une session (présentiel, visio via video_url) — capacité manage_sessions
      responses: { "201": { description: Session créée } }
    get:
      summary: Lister (lisible par les apprenants)
      responses: { "200": { description: Sessions } }
  /v1/tenants/{tenant_id}/training-sessions.ics:
    get:
      summary: Export iCalendar des sessions
      parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Flux ICS } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainID:
      name: domain_id
      in: path
      required: true
      schema: { type: string }
    LearnerID:
      name: learner_id
      in: path
      required: true
      schema: { type: string }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string }
    ProgramID:
      name: program_id
      in: path
      required: true
      schema: { type: string }
    ActivityID:
      name: activity_id
      in: path
      required: true
      schema: { type: string }
    CohortID:
      name: cohort_id
      in: path
      required: true
      schema: { type: string }
    SessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    LLMScopeType:
      name: scope_type
      in: query
      required: false
      schema:
        type: string
        enum: [tenant, program, cohort, learner]
        default: tenant
      description: LLM configuration scope. Non-tenant scopes require scope_id.
    LLMScopeID:
      name: scope_id
      in: query
      required: false
      schema: { type: string }
      description: Required for program, cohort, and learner LLM configuration scopes; omitted for tenant scope.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: Reuses the first successful response for retry-safe critical mutations.
  responses:
    Error:
      description: JSON error response
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    Token:
      description: JWT token
      content:
        application/json:
          schema:
            type: object
            required: [access_token, token_type]
            properties:
              access_token: { type: string }
              token_type: { type: string, const: Bearer }
  schemas:
    Role:
      type: string
      enum: [SUPER_ADMIN, TENANT_ADMIN, TRAINER, LEARNER]
    Tenant:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Membership:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        user_id: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }
    TenantUser:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        user_id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        user_status: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        membership_status: { type: string }
        user_created_at: { type: string, format: date-time }
        user_updated_at: { type: string, format: date-time }
        user_archived_at: { type: string, format: date-time }
