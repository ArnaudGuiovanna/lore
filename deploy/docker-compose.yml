services:
  lore:
    build:
      context: ..
      dockerfile: deploy/lore.Dockerfile
    environment:
      PORT: "8080"
      STORE_DRIVER: postgres
      LORE_AUTO_MIGRATE: "on"
      LORE_MIGRATION_PATH: /db/migrations/000001_init.sql
      DATABASE_URL: postgres://lore:lore@postgres:5432/lore?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: local-dev-change-me
      LORE_LLM_PROVIDER: ollama
      LORE_LLM_MODEL: gemma4
      LORE_LLM_BASE_URL: ""
      LORE_LLM_API_KEY: ""
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - nats
      - ollama

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lore
    ports:
      - "15432:5432"
    volumes:
      - lore-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - lore-ollama:/root/.ollama

volumes:
  lore-postgres:
  lore-ollama:
